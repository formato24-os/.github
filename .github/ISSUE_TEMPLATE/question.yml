name: Domanda o commento
description: Fai una domanda non riservata o lascia un commento su Cocosite o su questi documenti.
title: "[Domanda]: "
body:
  - type: markdown
    attributes:
      value: |
        Leggi prima il [supporto](https://github.com/formato24-os/.github/blob/main/SUPPORT.md).
        Questa segnalazione è pubblica. Non inserire email dell'account, password, codici di verifica, link di ripristino, token o dettagli privati dell'homelab.
        Cocosite è in alpha privata: questo modulo non dà accesso a una build né a un canale privato per recuperare l'account.
  - type: input
    id: project
    attributes:
      label: Progetto e versione, se serve
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Cosa stai cercando di fare?
      description: Descrivi l'obiettivo e la domanda o il commento che vuoi far valutare ai manutentori.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Cosa hai già controllato o provato?
      description: Collega la documentazione utile e descrivi il passaggio interessato. Oscura ogni dettaglio privato.
    validations:
      required: true
