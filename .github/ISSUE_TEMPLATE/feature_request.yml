name: Proponi una funzione
description: Suggerisci un miglioramento a un progetto esistente.
title: "[Funzione]: "
body:
  - type: markdown
    attributes:
      value: |
        Cerca prima tra le proposte esistenti. Spiega il problema prima di suggerire una soluzione.
        Non c'è un impegno di uscite mensili di nuovi progetti.
        Distingui una funzione nuova da un problema nel [perimetro documentato dell'alpha](https://github.com/formato24-os/.github/blob/main/docs/COCOSITE.md).
  - type: input
    id: project
    attributes:
      label: Progetto o repository interessato
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problema e destinatari
      description: Quale problema vuoi risolvere, e chi lo incontra?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Miglioramento proposto
      description: Descrivi il comportamento desiderato con un esempio concreto.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative considerate
      description: Indica opzioni esistenti o modi per aggirare il problema, se ci sono.
  - type: textarea
    id: context
    attributes:
      label: Perimetro e contesto
      description: Indica vincoli di hardware o connessione, implicazioni su dati e privacy, segnalazioni collegate e se puoi aiutare a provare. Ometti dettagli privati di dispositivi e account.
