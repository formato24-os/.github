name: Feature request
description: Suggest an improvement to an existing project.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing proposals first. Explain the problem before suggesting an implementation.
        Cocosite is the current priority; there is no monthly project release commitment.
        Distinguish a new capability from a bug in the [documented alpha scope](https://github.com/formato24-os/.github/blob/main/docs/COCOSITE.md).
  - type: input
    id: project
    attributes:
      label: Affected project or repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and audience
      description: What problem are you trying to solve, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Describe the desired behavior and a concrete example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing options or workarounds, if any.
  - type: textarea
    id: context
    attributes:
      label: Scope and context
      description: Note hardware or connectivity constraints, data/privacy implications, related issues, and any testing help you can offer. Omit private device and account details.
