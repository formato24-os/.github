name: Segnala un problema
description: Segnala un comportamento riproducibile che non funziona come previsto.
title: "[Problema]: "
body:
  - type: markdown
    attributes:
      value: |
        Cerca tra le segnalazioni esistenti prima di aprirne una. Quando possibile usa il repository del progetto interessato.
        Non pubblicare segreti o vulnerabilità non ancora pubbliche. Per le segnalazioni private segui la [politica di sicurezza](https://github.com/formato24-os/.github/blob/main/SECURITY.md).
        Per Cocosite controlla il [perimetro dell'alpha](https://github.com/formato24-os/.github/blob/main/docs/COCOSITE.md). Non pubblicare mai codici di verifica, token, email dell'account o indirizzi privati dell'homelab.
  - type: input
    id: project
    attributes:
      label: Progetto o repository interessato
      placeholder: Cocosite Desktop, profilo dell'organizzazione o un altro repository
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Cosa è successo?
      description: Descrivi il comportamento reale e il suo impatto.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passaggi per riprodurlo
      description: Includi un esempio minimo o la pagina o risorsa interessata.
      placeholder: |
        1. Parti da...
        2. Fai...
        3. Osserva...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
      description: Cosa dovrebbe succedere invece?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versione e ambiente
      description: Indica la versione della build mostrata nell'app, sistema operativo e browser o ambiente, oppure l'indirizzo della documentazione. Specifica se il problema riguarda registrazione, verifica, accesso, primo avvio o un'azione su un progetto.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Altre informazioni
      description: Aggiungi log ripuliti, screenshot o segnalazioni collegate se utili. Togli credenziali e dati privati.
