name: Project proposal
description: Propose a focused initiative with a clear relation to Formato24's current direction.
title: "[Project]: "
body:
  - type: markdown
    attributes:
      value: |
        Organization-wide proposals belong in [community issues](https://github.com/formato24-os/.github/issues).
        Cocosite is the current product focus. There is no monthly project cycle.
        A proposal does not create a repository, authorize source publication, or commit maintainers to a release date.
        See our [governance model](https://github.com/formato24-os/.github/blob/main/GOVERNANCE.md) for the selection process.
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended users
      description: Explain the need and who would benefit.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful result and how someone would use it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and relation to Cocosite
      description: Explain how this supports the current product direction. List essential work, exclusions, dependencies, and how success could be verified.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Licensing and publication
      description: Describe proposed reuse terms and third-party dependencies. Do not assume product source can be published or that all Formato24 projects use the same license.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: Link to relevant existing projects and explain what this proposal adds.
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: Maintenance and participation
      description: Describe likely ongoing work, needed skills, and whether you can help. A maintainer does not need to be appointed at proposal time.
    validations:
      required: true
