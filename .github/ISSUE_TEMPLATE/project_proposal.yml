name: Proposta di progetto
description: Proponi un'iniziativa mirata, legata chiaramente alla direzione attuale di Formato24.
title: "[Progetto]: "
body:
  - type: markdown
    attributes:
      value: |
        Le proposte che riguardano tutta l'organizzazione vanno nelle [segnalazioni della community](https://github.com/formato24-os/.github/issues).
        Non c'è un ciclo mensile di nuovi progetti.
        Una proposta non crea un repository, non autorizza a pubblicare codice e non impegna i manutentori su una data di uscita.
        Per come si scelgono le proposte vedi la [governance](https://github.com/formato24-os/.github/blob/main/GOVERNANCE.md).
  - type: textarea
    id: problem
    attributes:
      label: Problema e destinatari
      description: Spiega il bisogno e chi ne trarrebbe vantaggio.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Risultato proposto
      description: Descrivi il risultato utile più piccolo e come lo si userebbe.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Perimetro e legame con la direzione attuale
      description: Spiega come sostiene la direzione attuale. Elenca il lavoro essenziale, cosa resta fuori, le dipendenze e come si verificherebbe il successo.
    validations:
      required: true
  - type: textarea
    id: licensing
    attributes:
      label: Licenza e pubblicazione
      description: Descrivi i termini di riuso proposti e le dipendenze di terze parti. Non dare per scontato che il codice si possa pubblicare o che tutti i progetti Formato24 abbiano la stessa licenza.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative esistenti
      description: Collega i progetti esistenti e spiega cosa aggiunge questa proposta.
    validations:
      required: true
  - type: textarea
    id: maintenance
    attributes:
      label: Manutenzione e partecipazione
      description: Descrivi il lavoro continuo probabile, le competenze necessarie e se puoi aiutare. Non serve nominare un manutentore al momento della proposta.
    validations:
      required: true
