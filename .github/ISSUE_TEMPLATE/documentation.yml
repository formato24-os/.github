name: Migliora documentazione o risorse
description: Migliora una guida, correggi un link o suggerisci una risorsa per sviluppatori.
title: "[Documentazione]: "
body:
  - type: input
    id: location
    attributes:
      label: Pagina, file o risorsa
      description: Collega il contenuto interessato o indica dove va l'aggiunta.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Cosa va migliorato?
      description: Spiega cosa non è chiaro, è sbagliato, manca o sarebbe utile aggiungere.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Modifica proposta
      description: Proponi una correzione o un link a una risorsa ufficiale, con una breve motivazione.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Fonti e contesto
      description: Indica i riferimenti e, se serve, i limiti di licenza o dei piani gratuiti.
